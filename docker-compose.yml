# PostgreSQL with pgvector preinstalled -- the only database dependency.
#   docker compose up -d db
#   then point .env at localhost:5432 (user/password/db below)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: semantic_search_db
      POSTGRES_USER: username
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
